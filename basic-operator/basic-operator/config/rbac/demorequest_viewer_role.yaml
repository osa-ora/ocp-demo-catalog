# This rule is not used by the project osaora-demo-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to demo.osa.ora resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: osaora-demo-operator
    app.kubernetes.io/managed-by: kustomize
  name: demorequest-viewer-role
rules:
- apiGroups:
  - demo.osa.ora
  resources:
  - demorequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - demo.osa.ora
  resources:
  - demorequests/status
  verbs:
  - get
