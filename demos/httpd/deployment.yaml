apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-demo
  template:
    metadata:
      labels:
        app: httpd-demo
    spec:
      containers:
      - name: httpd
        image: registry.access.redhat.com/ubi9/httpd-24
        ports:
        - containerPort: 8080
