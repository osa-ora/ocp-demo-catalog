apiVersion: demo.redhat.io/v1alpha1
kind: DemoCatalog

demos:
  - name: nginx
    displayName: NGINX Demo
    description: Simple nginx web server
    namespace: nginx-demo
    manifests:
      - deployment.yaml
      - service.yaml
      - route.yaml

  - name: httpd
    displayName: Apache HTTPD Demo
    description: Simple Apache deployment
    namespace: httpd-demo
    manifests:
      - deployment.yaml
      - service.yaml
      - route.yaml
